[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-pbot"
version = "0.1.0"
description = "Kalshi demo/paper market-making and pair-arb bot for 15-minute crypto Up/Down markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kalshi-demo-bot" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "cryptography>=43.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
kalshi-pbot = "kalshi_pbot.cli:app"

[tool.setuptools.packages.find]
include = ["kalshi_pbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
